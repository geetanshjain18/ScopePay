# Free web service with an external free PostgreSQL database.
# No paid compute or persistent disk is provisioned.
services:
  - type: web
    name: scopepay
    runtime: node
    region: singapore
    plan: free
    numInstances: 1
    buildCommand: npm ci --omit=dev && npm run check
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
      - key: FREE_HOSTING
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: OWNER_SETUP_TOKEN
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
